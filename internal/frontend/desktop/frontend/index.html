<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>gotextforge</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e13;
      }
      #screen {
        display: block;
        width: 100%;
        height: 100%;
      }
      #keys {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        opacity: 0;
        resize: none;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <textarea id="keys" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
